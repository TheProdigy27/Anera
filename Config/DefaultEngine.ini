; --- Parties en ligne par Steam (tâche 2.5) ---
; Pilote réseau du jeu : SteamSockets (connexion par le relais de Valve, sans port à ouvrir). Sans Steam
; (éditeur, PIE, Steam fermé), le moteur se rabat sur le pilote IP classique (DriverClassNameFallback).
; Section GameEngine : seul le jeu hors éditeur la lit ; l'éditeur et le PIE gardent le pilote IP.
[/Script/Engine.GameEngine]
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/SteamSockets.SteamSocketsNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="BeaconNetDriver",DriverClassName="/Script/OnlineSubsystemUtils.IpNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="DemoNetDriver",DriverClassName="/Script/Engine.DemoNetDriver",DriverClassNameFallback="/Script/Engine.DemoNetDriver")

; Service en ligne par défaut : Steam. S'il ne démarre pas, le moteur prend le sous-système NULL (réseau local).
[OnlineSubsystem]
DefaultPlatformService=Steam

; 480 = « Spacewar », l'App ID de test de Valve, utilisable par tous les projets en développement. Hors Shipping,
; le moteur écrit steam_appid.txt à côté de l'exécutable pour que Steam l'accepte sans lancer le jeu depuis Steam.
[OnlineSubsystemSteam]
bEnabled=true
SteamDevAppId=480
bRelaunchInSteam=false

; Abandon d'une connexion sans réponse au bout de 30 s (120 s par défaut avec SteamSockets).
[/Script/SteamSockets.SteamSocketsNetDriver]
InitialConnectTimeout=30.0

[/Script/GameplayDebugger.GameplayDebuggerConfig]
; Outil de débogage de l'IA (builds hors Shipping). Sa touche par défaut, l'apostrophe, est la touche 4
; d'un clavier AZERTY, qui choisit une carte : il passe sur F6, que le moteur n'utilise pas.
ActivationKey=F6
